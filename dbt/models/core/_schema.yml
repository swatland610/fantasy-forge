version: 2

models:
  - name: dim_games
    description: Game dimension with outcomes, conditions, and derived win/loss flags
    columns:
      - name: game_id
        description: Unique game identifier
        tests:
          - unique
          - not_null
      - name: season
        tests:
          - not_null
      - name: week
        tests:
          - not_null
      - name: home_team
        description: Home team abbreviation
        tests:
          - not_null
      - name: away_team
        description: Away team abbreviation
        tests:
          - not_null
      - name: winning_team
        description: Team abbreviation of the winner (null for ties)
      - name: is_tie
        description: Boolean flag indicating if game ended in a tie

  - name: dim_players
    description: Player dimension with IDs, biographical data, and career info
    columns:
      - name: player_id
        description: Unique player identifier (GSIS ID)
        tests:
          - unique
          - not_null
      - name: display_name
        description: Player's display name
        tests:
          - not_null
      - name: position
        description: Player's primary position
      - name: sleeper_id
        description: Sleeper platform player ID (for future API integration)

  - name: dim_teams
    description: Team dimension with conference, division, and branding info
    columns:
      - name: team_abbr
        description: Team abbreviation (primary key)
        tests:
          - unique
          - not_null
      - name: team_name
        description: Full team name
        tests:
          - not_null
      - name: conference
        description: AFC or NFC
        tests:
          - accepted_values:
              values: ['AFC', 'NFC']
      - name: division
        description: Full division name (e.g., AFC East, NFC West)
        tests:
          - accepted_values:
              values: ['AFC East', 'AFC West', 'AFC North', 'AFC South', 'NFC East', 'NFC West', 'NFC North', 'NFC South']

  - name: fct_player_season_stats
    description: >
      Season rollup of player stats, one row per (player_id, season), regular season only.
      Source unit for the preseason projection (V3). Mid-season team changes collapse to one
      row (team/position = last by week). Efficiency rates are NULL when the player had zero
      opportunities of that type (surfaced, not coalesced); avg_* shares are means of per-game
      shares, not true season shares.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - player_id
            - season
    columns:
      - name: player_id
        description: Player identifier (foreign key to dim_players)
        tests:
          - not_null
          - relationships:
              to: ref('dim_players')
              field: player_id
      - name: season
        tests:
          - not_null
      - name: position
        description: Player's last position of the season (filtered to QB, RB, WR, TE, K)
        tests:
          - accepted_values:
              values: ['QB', 'RB', 'WR', 'TE', 'K']
      - name: games_played
        description: Distinct regular-season weeks the player recorded a game
        tests:
          - not_null

  - name: fct_team_season_stats
    description: >
      Season rollup of team offensive stats, one row per (team, season), regular season only.
      Source unit for proj_team_season_offense. Includes season totals and per-game rates for
      passing, rushing, and targets (the allocation pie for the downstream player-level model).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - team
            - season
    columns:
      - name: team
        description: Team abbreviation
        tests:
          - not_null
      - name: season
        description: NFL season year
        tests:
          - not_null
      - name: games_played
        description: Regular season games played (row count from stg_nflverse__team_stats)
        tests:
          - not_null
      - name: targets
        description: Total pass targets — the allocation pie for the downstream player-level model
        tests:
          - not_null

  - name: fct_player_game_stats
    description: Fact table of player statistics per game with fantasy points and game context
    columns:
      - name: player_id
        description: Player identifier (foreign key to dim_players)
        tests:
          - not_null
          - relationships:
              to: ref('dim_players')
              field: player_id
      - name: season
        tests:
          - not_null
      - name: week
        tests:
          - not_null
      - name: position
        description: Player position (filtered to QB, RB, WR, TE, K)
        tests:
          - accepted_values:
              values: ['QB', 'RB', 'WR', 'TE', 'K']
      - name: fantasy_points
        description: Standard scoring fantasy points
      - name: fantasy_points_ppr
        description: PPR scoring fantasy points
      - name: fantasy_points_half
        description: Half-PPR scoring fantasy points
      - name: is_home_game
        description: Boolean flag if player's team was home
      - name: team_won
        description: Boolean flag if player's team won (null for ties)
