version: 2

models:
  - name: stg_nflverse__player_stats
    description: Player-level statistics per game week, cleaned from nflverse source
    columns:
      - name: player_id
        description: Unique player identifier (GSIS ID) - some nulls exist for team-level records
        tests:
          - not_null:
              config:
                severity: warn
      - name: season
        description: NFL season year
        tests:
          - not_null
      - name: week
        description: Week number within the season
        tests:
          - not_null
      - name: fantasy_points
        description: Standard scoring fantasy points
      - name: fantasy_points_ppr
        description: PPR scoring fantasy points
      - name: fantasy_points_half
        description: Half-PPR scoring fantasy points

  - name: stg_nflverse__players
    description: Player dimension data including biographical and career info
    columns:
      - name: player_id
        description: Unique player identifier (GSIS ID)
        tests:
          - unique
          - not_null

  - name: stg_nflverse__teams
    description: NFL team reference data
    columns:
      - name: team_abbr
        description: Team abbreviation (e.g., KC, BUF)
        tests:
          - unique
          - not_null

  - name: stg_nflverse__schedules
    description: NFL game schedule with results and conditions
    columns:
      - name: game_id
        description: Unique game identifier
        tests:
          - unique
          - not_null
      - name: season
        tests:
          - not_null
      - name: week
        tests:
          - not_null

  - name: stg_nflverse__ff_playerids
    description: Crosswalk table mapping player IDs across fantasy platforms
    columns:
      - name: player_id
        description: GSIS player ID
        tests:
          - unique
          - not_null
      - name: sleeper_id
        description: Sleeper platform player ID
      - name: fantasypros_id
        description: FantasyPros player ID (crosswalk key for ff_rankings ECR)

  - name: stg_nflverse__ff_rankings
    description: >
      FantasyPros redraft-superflex ECR, one contemporaneous preseason (latest-August) snapshot
      per season. The V-GATE market baseline. Grain: one row per (projection_season,
      fantasypros_id). player_id (gsis) is a nullable crosswalk -- unmatched rows are kept and
      flagged via has_gsis_match, not dropped.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - projection_season
            - fantasypros_id
    columns:
      - name: projection_season
        description: Season the snapshot ranks (= the August scrape's calendar year)
        tests:
          - not_null
      - name: fantasypros_id
        description: FantasyPros player ID (natural key from the source)
        tests:
          - not_null
      - name: player_id
        description: GSIS player ID via the crosswalk; NULL when unmatched (surfaced)
      - name: position
        tests:
          - not_null
          - accepted_values:
              values: ['QB', 'RB', 'WR', 'TE']
      - name: ecr
        description: Expert consensus rank (lower = better); the field the backtest ranks on
        tests:
          - not_null

  - name: stg_nflverse__play_by_plays
    description: Play-by-play data for NFL games

  - name: stg_nflverse__snap_counts
    description: Player snap count data per game

  - name: stg_nflverse__team_stats
    description: Team-level aggregate statistics per game
