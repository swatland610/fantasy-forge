version: 2

models:
  - name: stg_durability_overrides
    description: >
      Manual, human-curated projected_games overrides (durability_overrides_2026 seed),
      crosswalked to dim_players via normalized name + position. Every row carries a written
      reason -- consumed by proj_player_season_components to replace the fitted
      reliability-shrunk games estimate outright for specific flagged players (e.g. one-off
      unrelated injuries a games_played-only model can't distinguish from chronic fragility).
      Empty for every player by default; see the model's header for why this exists instead
      of an automated fix.
    columns:
      - name: player_name
        tests:
          - not_null
      - name: has_gsis_match
        tests:
          - not_null
      - name: override_games
        tests:
          - not_null

  - name: stg_analysts__draft_rankings
    description: >
      Analyst snake-draft rankings (analyst_draft_rankings_2026 seed) crosswalked to
      dim_players via normalized name + position, with team as a tiebreaker only. See the
      model's header comment for the join strategy and known failure modes; unmatched rows
      are kept with player_id = NULL rather than dropped.
    columns:
      - name: analyst
        tests:
          - not_null
      - name: was_aliased
        description: True when player_name came from analyst_name_aliases, not the raw source text -- never coalesce without a flag
        tests:
          - not_null
      - name: normalized_position_rank
        description: Single per-(analyst, position) ordinal rank, normalized across each source's rank/tier format -- see model header
      - name: player_name
        tests:
          - not_null
      - name: has_gsis_match
        tests:
          - not_null

  - name: stg_superflex_mock__qb_capital
    description: >
      One real 12-team superflex mock draft's QB pick order (superflex_mock_qb_capital_2026
      seed), crosswalked to dim_players via normalized name. Real revealed-preference
      superflex QB demand -- CBS's own auction-value sheet has none. n=1 mock, and several
      rows have flagged extraction uncertainty (see extraction_flagged / notes and the
      model header) -- treat pick_no as directional, not exact.
    columns:
      - name: player_name
        tests:
          - not_null
      - name: has_gsis_match
        tests:
          - not_null
      - name: pick_no
        tests:
          - not_null
          - unique

  - name: stg_analysts__auction_values
    description: >
      CBS Consensus auction $ values (cbs_consensus_auction_values seed) crosswalked to
      dim_players via cbs_id -- an exact numeric-id join, no name normalization involved.
    columns:
      - name: cbs_id
        tests:
          - not_null
          - unique
      - name: has_gsis_match
        tests:
          - not_null

  - name: stg_nflverse__player_stats
    description: Player-level statistics per game week, cleaned from nflverse source
    columns:
      - name: player_id
        description: Unique player identifier (GSIS ID) - some nulls exist for team-level records
        tests:
          - not_null:
              config:
                severity: warn
      - name: season
        description: NFL season year
        tests:
          - not_null
      - name: week
        description: Week number within the season
        tests:
          - not_null
      - name: fantasy_points
        description: Standard scoring fantasy points
      - name: fantasy_points_ppr
        description: PPR scoring fantasy points
      - name: fantasy_points_half
        description: Half-PPR scoring fantasy points

  - name: stg_nflverse__players
    description: Player dimension data including biographical and career info
    columns:
      - name: player_id
        description: Unique player identifier (GSIS ID)
        tests:
          - unique
          - not_null

  - name: stg_nflverse__teams
    description: NFL team reference data
    columns:
      - name: team_abbr
        description: Team abbreviation (e.g., KC, BUF)
        tests:
          - unique
          - not_null

  - name: stg_nflverse__schedules
    description: NFL game schedule with results and conditions
    columns:
      - name: game_id
        description: Unique game identifier
        tests:
          - unique
          - not_null
      - name: season
        tests:
          - not_null
      - name: week
        tests:
          - not_null

  - name: stg_nflverse__ff_playerids
    description: Crosswalk table mapping player IDs across fantasy platforms
    columns:
      - name: player_id
        description: GSIS player ID
        tests:
          - unique
          - not_null
      - name: sleeper_id
        description: Sleeper platform player ID
      - name: fantasypros_id
        description: FantasyPros player ID (crosswalk key for ff_rankings ECR)

  - name: stg_nflverse__ff_rankings
    description: >
      FantasyPros redraft-superflex ECR, one contemporaneous preseason (latest-August) snapshot
      per season. The V-GATE market baseline. Grain: one row per (projection_season,
      fantasypros_id). player_id (gsis) is a nullable crosswalk -- unmatched rows are kept and
      flagged via has_gsis_match, not dropped.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - projection_season
            - fantasypros_id
    columns:
      - name: projection_season
        description: Season the snapshot ranks (= the August scrape's calendar year)
        tests:
          - not_null
      - name: fantasypros_id
        description: FantasyPros player ID (natural key from the source)
        tests:
          - not_null
      - name: player_id
        description: GSIS player ID via the crosswalk; NULL when unmatched (surfaced)
      - name: position
        tests:
          - not_null
          - accepted_values:
              values: ['QB', 'RB', 'WR', 'TE']
      - name: ecr
        description: Expert consensus rank (lower = better); the field the backtest ranks on
        tests:
          - not_null

  - name: stg_nflverse__play_by_plays
    description: Play-by-play data for NFL games

  - name: stg_nflverse__snap_counts
    description: Player snap count data per game

  - name: stg_nflverse__team_stats
    description: Team-level aggregate statistics per game
